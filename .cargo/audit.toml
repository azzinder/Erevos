# What `cargo audit` (CI: .github/workflows/rust.yml) lets pass, and why. Each line is checked
# again when the crate behind it changes.
[advisories]
ignore = [
    # rsa (Marvin attack, no fixed version): only Tor's code (arti) has it, which verifies relays'
    # RSA signatures and never decrypts with RSA, where the timing leaks.
    "RUSTSEC-2023-0071",
    # libcrux-kem 0.0.9 (panics on short seeds and keys): in Cargo.lock only as the libcrux backend
    # of hpke-rs, a feature nothing here turns on, so it is never built (`cargo tree -i libcrux-kem
    # --all-features --target all` prints nothing). OpenMLS's crypto crate pins it.
    "RUSTSEC-2026-0330",
    "RUSTSEC-2026-0331",
    # crypto-bigint 0.5.5 (timing that varies in what should be constant-time, fixed in 0.7.6): it
    # comes through elliptic-curve 0.13 (k256 for Nostr, p256 for the relay) and OpenMLS's crypto
    # crates, which pin that line, so no version here takes the fix yet. Taken out once OpenMLS and
    # elliptic-curve move to crypto-bigint 0.7 (`cargo tree -i crypto-bigint@0.5.5` prints nothing).
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.38.2 (SQLite before 3.54.0 can hand back uninitialized memory when it opens a
    # database with a -wal file of another page size, both crafted by someone else): only Tor's
    # directory cache (arti's tor-dirmgr, through rusqlite 0.40) has it, a database arti alone
    # writes, in the app's own private folder. Even arti 0.48 still pins rusqlite 0.40. Taken out
    # once arti moves to rusqlite 0.41 (`cargo tree -i libsqlite3-sys` shows 0.39 or later).
    "RUSTSEC-2026-0459",
    # zip 1.3.1 (extract() writes outside the folder through symlinks and ../, keeps SUID bits, or
    # aborts on a crafted symlink entry): only candle-core 0.9.1 has it, for .npz and PyTorch files
    # (npy.rs, pickle.rs), which read entries by name and never call extract(). Erevos's speech and
    # translation (crates/erevos-speech) load only GGUF models, checked by SHA-256, so no zip code
    # runs at all. candle 0.11 takes zip 9 but brings the tokenizers crate and its C++ with it.
    # Taken out once candle moves on here (`cargo tree -i zip` shows 9 or later, or nothing).
    "RUSTSEC-2025-0168",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # Two more on 2026-11-17, same reason: ZipStreamReader (candle uses only ZipArchive) and AES
    # entries (no encrypted zip is ever opened; candle reads no zip at all for GGUF).
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
]
