name: web-watch

# Checks, every Monday, the Erevos web app as the server gives it out (pwa/): that its release is
# signed with pwa/release-key.pub and every file matches. A server that gave out other code to
# everyone would fail here; one that did so to a single person would not, which README.md in pwa/
# says. Runs once the repository variable EREVOS_WEB_URL holds the address (https://…).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    if: vars.EREVOS_WEB_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node pwa/release.mjs verify "${{ vars.EREVOS_WEB_URL }}"
