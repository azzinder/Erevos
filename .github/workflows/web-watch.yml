name: web-watch

# Checks, every day, the Erevos web app as the server gives it out (pwa/): that its release is
# signed with pwa/release-key.pub and every file matches. A server that gave out other code to
# everyone would fail here; one that did so to a single person would not, which README.md in pwa/
# says. Runs once the repository variable EREVOS_WEB_URL holds the address (https://…).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    if: vars.EREVOS_WEB_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node pwa/release.mjs verify "${{ vars.EREVOS_WEB_URL }}"
