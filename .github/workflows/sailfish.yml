name: sailfish

# Erevos for Sailfish OS (sailfish/): the web build with the core in WebAssembly, in Sailfish
# WebView, packaged as an RPM with the Sailfish SDK's build image. Runs by hand only: the SDK image
# is large, and main's RPM goes out with every release (release.yml). The RPM is kept as the run's
# artifact.

on:
  workflow_dispatch:

jobs:
  rpm:
    # ubuntu-26.04 (ubuntu-latest since 11-2026) runs Docker where the Sailfish SDK's sb2d cannot
    # create its server socket: the SDK builds on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the web app with its core, and the icons
        run: sailfish/build-web.sh
      - name: Build the RPM for aarch64
        working-directory: sailfish
        run: |
          # The SDK image builds as its own user.
          chmod -R a+rwX .
          docker run --rm -v "$PWD:/home/mersdk/src" -w /home/mersdk/src \
            coderus/sailfishos-platform-sdk-aarch64:5.0.0.43 \
            bash -lc 'mb2 -t SailfishOS-5.0.0.43-aarch64 build'
          ls RPMS/*.aarch64.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erevos-sailfish
          path: sailfish/RPMS/*.rpm
