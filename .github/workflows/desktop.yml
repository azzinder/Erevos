name: desktop

# Erevos for Linux, macOS and Windows (desktop/): the web build with the core in WebAssembly, in
# Electron. Nobody on the team has a Mac, so the Mac's disk image is opened and its app started
# here, on GitHub's Mac runner, with --smoke (desktop/main.js): it waits for the first screen and
# the core. The Windows app is started the same way on GitHub's Windows runner. The packages are
# kept as the run's artifacts. Main's packages go out with every release (release.yml).

on:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the web app with its core
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_SHELL: electron
        run: |
          npm ci
          node scripts/build-web-core.mjs
          npx expo export --clear --platform web --output-dir ../desktop/web
          test -f ../desktop/web/core/erevos_ffi_bg.wasm
      - run: npm ci
        working-directory: desktop
      - name: Start it and wait for its first screen
        working-directory: desktop
        run: xvfb-run -a npx electron . --smoke --no-sandbox --plain-secrets
      - name: Package for Linux
        working-directory: desktop
        run: |
          # The Arch package is made with bsdtar.
          sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools
          npx electron-builder --linux pacman AppImage --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erevos-linux
          path: |
            desktop/dist/*.pacman
            desktop/dist/*.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-web
          path: desktop/web

  # A Mac minute counts as ten of the free ones, so the Mac build runs only when started by hand
  # (Actions, desktop, Run workflow); release.yml builds main's.
  macos:
    needs: linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-web
          path: desktop/web
      - run: npm ci
        working-directory: desktop
      - name: Package for macOS (Apple silicon and Intel)
        working-directory: desktop
        # electron-builder leaves the app unsigned in a pull request's run unless told otherwise,
        # and an unsigned app does not start on Apple silicon. The signature is ad hoc ("-").
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: npx electron-builder --mac dmg --universal --publish never
      - name: Open the disk image and start the app
        run: |
          set -euo pipefail
          dmg=$(ls desktop/dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -noautoopen -mountpoint "$mnt"
          app="$mnt/Erevos.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Erevos")
          echo "Architectures: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::No Apple silicon code"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::No Intel code"; exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 "$app"
          # A keychain of its own, unlocked, so the app's Keychain item is made without a prompt.
          keychain="$RUNNER_TEMP/erevos-check.keychain-db"
          security create-keychain -p erevos-check "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p erevos-check "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          "$app/Contents/MacOS/Erevos" --smoke | tee smoke.log
          grep -q "SMOKE OK core=true secrets=encrypted" smoke.log
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erevos-macos
          path: desktop/dist/*.dmg

  # A Windows minute counts as two, so the Windows build too runs only when started by hand.
  windows:
    needs: linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-web
          path: desktop/web
      - run: npm ci
        working-directory: desktop
      - name: Package for Windows (installer and portable)
        working-directory: desktop
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Start the app and wait for its first screen
        run: |
          set -euo pipefail
          desktop/dist/win-unpacked/Erevos.exe --smoke | tee smoke.log
          grep -q "SMOKE OK core=true secrets=encrypted" smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erevos-windows
          path: desktop/dist/*.exe
