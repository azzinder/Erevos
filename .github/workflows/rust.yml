name: rust

# Branch pushes are checked by their pull request, so push runs only for main: half the minutes.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch stops the check still running on an older one, so only the newest
# commit is checked and the minutes go to it alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      # Known advisories in the locked crates; .cargo/audit.toml says which pass, and why.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
      - run: cargo clippy --all-targets -- -D warnings
      # The app's two ways into the core: JNI on Android and WebAssembly.
      - run: cargo clippy -p erevos-ffi --features android,tor,networks --all-targets -- -D warnings
      - run: cargo clippy -p erevos-ffi --features android,tor --all-targets -- -D warnings
      - run: cargo clippy -p erevos-ffi --features web,networks --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
