name: rust

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy --all-targets -- -D warnings
      # The app's two ways into the core: JNI on Android and WebAssembly.
      - run: cargo clippy -p erevos-ffi --features android --all-targets -- -D warnings
      - run: cargo clippy -p erevos-ffi --features web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
