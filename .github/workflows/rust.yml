name: rust

# Branch pushes are checked by their pull request, so push runs only for main: half the minutes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      # Known advisories in the locked crates; .cargo/audit.toml says which pass, and why.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
      - run: cargo clippy --all-targets -- -D warnings
      # The app's two ways into the core: JNI on Android and WebAssembly.
      - run: cargo clippy -p erevos-ffi --features android,tor --all-targets -- -D warnings
      - run: cargo clippy -p erevos-ffi --features web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
