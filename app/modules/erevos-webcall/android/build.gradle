apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.erevoswebcall'
version = '0.0.1'

android {
  namespace 'expo.modules.erevoswebcall'

  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

// Element Call, as its package on npm has it built (@element-hq/element-call-embedded, in
// package.json), goes into the app's assets under element-call/: without its source maps, the
// background blur's model and WebAssembly, and Matrix's own encryption in WebAssembly, none of which
// it uses inside Erevos, nor the older font files that WebView does not need.
def elementCall = file("${projectDir}/../../../node_modules/@element-hq/element-call-embedded/dist")
def elementCallAssets = layout.buildDirectory.dir("generated/element-call-assets").get().asFile

def copyElementCall = tasks.register('copyElementCall', Sync) {
  from(elementCall) {
    exclude '**/*.map', '**/vision_wasm_internal*', '**/selfie_segmenter*', '**/matrix_sdk_crypto_wasm*', '**/*.woff'
  }
  into("${elementCallAssets}/element-call")
  doFirst {
    if (!elementCall.exists()) throw new GradleException("Element Call is missing: run npm ci in app/ first (${elementCall})")
  }
}

android.sourceSets.main.assets.srcDirs += elementCallAssets
preBuild.dependsOn(copyElementCall)
