[package]
name = "erevos-tor"
description = "Relay requests through Tor for the Erevos apps, with Arti"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite", "bridge-client", "pt-client"] }
tor-config = { version = "0.47", default-features = false }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
