[package]
name = "erevos-matrix"
description = "Matrix end-to-end encryption for Erevos: Olm and Megolm through vodozemac, with the state kept by the app between calls"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# In a browser, the random numbers come from the browser.
js = ["vodozemac/wasm_js"]

[dependencies]
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
vodozemac = { version = "0.11.1", default-features = false }
