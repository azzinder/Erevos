[package]
name = "erevos-xmpp"
description = "OMEMO 0.3 for Erevos's XMPP accounts: the Signal protocol as Conversations, Gajim, Dino and Monal speak it, with the state kept by the app between calls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.3"
aes-gcm = "0.10.3"
base64 = "0.22"
cbc = { version = "0.2.1", features = ["alloc"] }
curve25519-dalek = "4.1.3"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
