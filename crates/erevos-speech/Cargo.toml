[package]
name = "erevos-speech"
description = "Voice messages written out on the phone itself, with a Whisper model taken when asked for"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Tensors and their matrix products on the phone's processor (no GPU, no network).
candle-core = { version = "=0.11.1", default-features = false }
# Its fused softmax and layer norm, several times faster than made of single steps.
candle-nn = { version = "=0.11.1", default-features = false }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
