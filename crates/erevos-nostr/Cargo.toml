[package]
name = "erevos-nostr"
description = "Nostr events for Erevos message text: NIP-01 signing, NIP-44 encryption, one-time wrapping"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chacha20 = "0.9"
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "ecdh", "arithmetic", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
