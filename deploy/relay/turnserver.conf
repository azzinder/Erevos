# Written by the Erevos relay installer, from deploy/relay/turnserver.conf.
# The call relay: calls between phones go through it, so neither learns the
# other's IP address. What it passes on is encrypted end to end (DTLS-SRTP),
# so it cannot listen in. Only phones the Erevos relay lets in get
# credentials for it (EREVOS_TURN_SECRET in /etc/erevos-relay.env).

listening-port=3478
min-port=50000
max-port=50999
realm=@DOMAIN@
fingerprint
use-auth-secret
static-auth-secret=@SECRET@

# Plain TURN only: the calls are encrypted inside it.
no-tls
no-dtls
no-cli

# Log nothing about who calls whom.
log-file=/dev/null
no-stdout-log

# Calls only: nothing on this server's own network, or anyone else's private one.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A few calls at a time for each phone, and a ceiling for the server.
user-quota=8
total-quota=400
stale-nonce=600
